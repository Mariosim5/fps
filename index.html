<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eidolon Engine - Replay Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body, app-root {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: block;
    }
    body {
      background-color: #111827; /* bg-gray-900 */
    }
    /* Custom scrollbar for a more thematic feel */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1f2937; /* bg-gray-800 */
    }
    ::-webkit-scrollbar-thumb {
      background: #4f46e5; /* bg-indigo-600 */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6366f1; /* bg-indigo-500 */
    }
    /* Keyframes for the title glow effect */
    @keyframes text-glow {
      0%, 100% {
        text-shadow: 0 0 5px #06b6d4, 0 0 10px #06b6d4, 0 0 15px #06b6d4;
      }
      50% {
        text-shadow: 0 0 10px #0891b2, 0 0 20px #0891b2, 0 0 30px #0891b2;
      }
    }
    .title-glow {
      animation: text-glow 3s ease-in-out infinite;
    }
    /* Keyframes for loading bar */
    @keyframes pulse-fast-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }
    .animate-pulse-fast-progress {
        animation: pulse-fast-progress 1.5s ease-in-out infinite;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "rxjs": "https://aistudiocdn.com/rxjs@^7.8.2?conditions=es2015",
    "rxjs/operators": "https://aistudiocdn.com/rxjs@^7.8.2/operators?conditions=es2015",
    "rxjs/ajax": "https://aistudiocdn.com/rxjs@^7.8.2/ajax?conditions=es2015",
    "rxjs/webSocket": "https://aistudiocdn.com/rxjs@^7.8.2/webSocket?conditions=es2015",
    "rxjs/testing": "https://aistudiocdn.com/rxjs@^7.8.2/testing?conditions=es2015",
    "rxjs/fetch": "https://aistudiocdn.com/rxjs@^7.8.2/fetch?conditions=es2015",
    "@angular/platform-browser": "https://next.esm.sh/@angular/platform-browser@^21.0.2?external=rxjs",
    "@angular/compiler": "https://next.esm.sh/@angular/compiler@^21.0.2?external=rxjs",
    "@angular/common/http": "https://next.esm.sh/@angular/common@^21.0.2/http?external=rxjs",
    "@angular/core": "https://next.esm.sh/@angular/core@^21.0.2?external=rxjs",
    "@angular/common": "https://next.esm.sh/@angular/common@^21.0.2?external=rxjs",
    "@google/genai": "https://esm.run/@google/genai",
    "three": "https://esm.sh/three@0.166.1",
    "three/examples/jsm/controls/PointerLockControls.js": "https://esm.sh/three@0.166.1/examples/jsm/controls/PointerLockControls.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://esm.sh/three@0.166.1/examples/jsm/loaders/GLTFLoader.js",
    "@angular/forms": "https://next.esm.sh/@angular/forms@^21.0.2?external=rxjs"
  }
}
</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
