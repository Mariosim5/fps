<div class="fixed inset-0 z-20 bg-gray-900/80 flex flex-col items-center justify-center text-white p-4 backdrop-blur-sm text-center">
  <header class="mb-8">
    <h1 class="text-6xl font-bold text-cyan-300 drop-shadow-lg title-glow">ASSALTO ARCANO</h1>
    <p class="text-xl text-gray-400 mt-2">Sopravvivi all'ondata. Scatena la magia.</p>
  </header>
  
  <div class="flex flex-col items-center w-full max-w-2xl">
    <!-- Main Action Panel -->
    <div class="w-full p-6 mb-6">
      @if (modelsLoaded()) {
        <p class="mb-6 text-lg text-cyan-400">Tutti i modelli di mostri sono stati caricati.</p>
        <button 
          (click)="startSimulation()"
          class="px-10 py-5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-2xl rounded-lg shadow-lg transition-all transform hover:scale-105"
        >
          Avvia Simulazione
        </button>
      } @else {
        <div class="flex flex-col items-center">
          <div class="w-64 h-4 bg-gray-700 rounded-full overflow-hidden">
              <div class="h-full bg-cyan-500 rounded-full animate-pulse-fast-progress"></div>
          </div>
          <p class="mt-4 text-lg text-gray-300">Caricamento dei modelli dei mostri...</p>
        </div>
      }
    </div>
  </div>

  <footer class="absolute bottom-8 text-gray-500 text-sm">
    <p>Usa i tasti 1, 2, 3 per cambiare incantesimo. W, A, S, D per muoverti.</p>
  </footer>
</div>
